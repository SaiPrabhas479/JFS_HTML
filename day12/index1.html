<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: relative;
            width: 100px;
            height: 100px;
            border: 2px solid;
            animation-name: move-box;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            background-color: aqua;
        }
        @keyframes move-box {
            0%{ left: 0;}
            50%{
                left: 200px;border-radius: 50%;transform: rotate(180deg);background-color: greenyellow;scale: 1.5;
            }
            100%{left: 0%;}
        }
    </style>
</head>
<body>
    <div class = "box">Prabhas</div>
</body>
</html>
