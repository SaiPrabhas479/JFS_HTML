<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Example</title>
    <style>
        body{
            height: 300px;
        }
        .absolute-container{
            position: relative;
            height: 200px;
            width: 200px;
            background-color: blueviolet;
        }
        .absolute-box{
            background-color: aqua; 
            top: 10px;
            right: 10px; 
            position: absolute;
            padding: 10px;
        }
        .fixed{
            position:fixed;
            top: 100px;

        }
        .sticky{
            position:sticky;
            top: 100px;

        }
    


    </style>
</head>
<body>
    <div class = "absolute-container">
        <div class ="absolute-box">Absolute Position</div>
    </div>
    <div class = "fixed">Fixed Element</div>
    <div class = "sticky">Sticky Element</div>
</body>
</html>
